---
# core: OpenBao (ADR-0039, ADR-0045, ADR-0047).

# OpenBao's TLS listener on the lab address, for the bastion (Kolla, OpenTofu in P2-P3) and the
# owner's laptop through the tailnet. The admin may still log in from 127.0.0.1 only (ADR-0047).
vm_firewall_tcp_services:
  - port: 8200
    sources:
      - 10.10.0.10/32
      - 10.255.255.1/32
    comment: OpenBao API over TLS, from the bastion and the tailnet (ADR-0047)

openbao_tls_address: 10.10.0.12:8200
openbao_tls_names:
  - core.akasha.internal
openbao_tls_ips:
  - 10.10.0.12
