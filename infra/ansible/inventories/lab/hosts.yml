# Lab inventory (ADR-0026, ADR-0035).
# - insa is reached through an SSH alias of the operator's ~/.ssh/config (Tailscale), so its
#   address is never committed (public repository).
# - The lab's VMs are reached by their lab-internal address on br-mgmt, routed to the laptop
#   through the tailnet; their host keys are checked against the serial console before they
#   are added to ~/.ssh/known_hosts.
all:
  children:
    l0_hosts:
      hosts:
        insa:
          ansible_host: insa
    lab_vms:
      vars:
        ansible_user: debian
      hosts:
        router:
          ansible_host: 10.10.0.1
