---
# OpenStack nodes (ADR-0041): VM base, router client, trust in OpenBao's SSH user CA (ADR-0050),
# read-only node checks. Kolla-Ansible configures them in P2; their host firewall is designed
# then too.
# No -K: the VMs' default user has passwordless sudo (ADR-0035). Always dry-run first; vm_base
# needs the private file:
#   uv run ansible-playbook playbooks/openstack-nodes.yml --check --diff -e @~/akasha-private/lab_vms.yml
- name: Configure the OpenStack nodes
  hosts: openstack_nodes
  become: true
  gather_facts: true
  # Modules parse command output: never use a locale other than C.
  environment:
    LC_ALL: C
    LANGUAGE: C
  pre_tasks:
    # Stop before any role changes a VM when the private input is missing.
    - name: Check the private input of the VM base
      ansible.builtin.import_role:
        name: vm_base
        tasks_from: check
      tags: [base]
  roles:
    - role: vm_base
      tags: [base]
    - role: lab_client
      tags: [client]
    - role: ssh_user_ca
      tags: [ssh_ca]
    - role: os_node
      tags: [node]
