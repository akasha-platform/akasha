---
# Edge router of the lab (ADR-0028, ADR-0035). No -K: the VM's default user has passwordless
# sudo. Always dry-run first; vm_base needs the private file:
#   uv run ansible-playbook playbooks/router.yml --check --diff -e @~/akasha-private/lab_vms.yml
- name: Configure the edge router of the lab
  hosts: router
  become: true
  gather_facts: true
  # Modules parse command output: never use a locale other than C.
  environment:
    LC_ALL: C
    LANGUAGE: C
  pre_tasks:
    # Stop before any role changes the VM when the private input is missing.
    - name: Check the private input of the VM base
      ansible.builtin.import_role:
        name: vm_base
        tasks_from: check
      tags: [base]
  roles:
    - role: vm_base
      tags: [base]
