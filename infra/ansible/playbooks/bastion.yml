---
# Bastion (ADR-0032, ADR-0040): VM base, router client, swap file (ADR-0030), host firewall,
# pinned toolchain for the unprivileged user akasha.
# No -K: the VM's default user has passwordless sudo (ADR-0035). Always dry-run first; vm_base
# needs the private file:
#   uv run ansible-playbook playbooks/bastion.yml --check --diff -e @~/akasha-private/lab_vms.yml
- name: Configure bastion
  hosts: bastion
  become: true
  gather_facts: true
  # Modules parse command output: never use a locale other than C.
  environment:
    LC_ALL: C
    LANGUAGE: C
  pre_tasks:
    # Stop before any role changes the VM when the private input is missing.
    - name: Check the private input of the VM base
      ansible.builtin.import_role:
        name: vm_base
        tasks_from: check
      tags: [base]
  roles:
    - role: vm_base
      tags: [base]
    - role: lab_client
      tags: [client]
    - role: vm_swap
      tags: [swap]
    - role: vm_firewall
      tags: [firewall]
    - role: bastion_toolchain
      tags: [toolchain]
