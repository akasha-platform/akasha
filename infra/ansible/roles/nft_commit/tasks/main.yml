---
# Load an nftables rule set "commit confirmed" (ADR-0037), shared by the router's and the
# VMs' firewalls: the caller's template is rendered into a candidate, checked by nft, loaded
# with a timer that restores the previous rules, and confirmed only once Ansible reaches the
# VM again over a new SSH connection. Only then does the boot file /etc/nftables.conf receive
# it, with a fingerprint of the loaded rule set; drift from that fingerprint loads the rules
# again, commit confirmed. nftables.service then loads the boot file at every boot.

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

# On a VM without nftables, a dry run has no nft: the rules can only be checked by the real
# run (`validate:` below).
- name: Look for nft
  ansible.builtin.stat:
    path: /usr/sbin/nft
  register: nft_commit_nft

# `validate:` does not run in check mode: check the rendered rules with the VM's nft and kernel
# in a temporary file, so the dry run already proves the syntax.
- name: Check the rendered rules in a dry run
  when: ansible_check_mode and nft_commit_nft.stat.exists
  check_mode: false
  block:
    - name: Create a temporary file for the rendered rules
      ansible.builtin.tempfile:
        suffix: .nft
      register: nft_commit_tmp

    - name: Render the rules into the temporary file
      ansible.builtin.template:
        src: "{{ nft_commit_src }}"
        dest: "{{ nft_commit_tmp.path }}"
        mode: "0600"

    - name: Check the rules with nft
      ansible.builtin.command: /usr/sbin/nft -c -f {{ nft_commit_tmp.path }}
      changed_when: false
  always:
    - name: Remove the temporary file
      ansible.builtin.file:
        path: "{{ nft_commit_tmp.path }}"
        state: absent
      when: nft_commit_tmp.path is defined

# Three files: the candidate Ansible renders, the confirmed file nftables.service loads at boot,
# and the fingerprint of the rule set loaded when it was confirmed. The confirmed file is only
# replaced once the VM is reached over a new SSH connection with the candidate loaded, so
# a rule set that was rolled back is never loaded again at boot or by a later run.
- name: Create the akasha configuration directory
  ansible.builtin.file:
    path: /etc/akasha
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the candidate rules (checked by nft before the file is replaced)
  ansible.builtin.template:
    src: "{{ nft_commit_src }}"
    dest: /etc/akasha/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  register: nft_commit_candidate
  when: not ansible_check_mode or nft_commit_nft.stat.exists

# Pending when the candidate differs from the confirmed file, or when the loaded rule set is not
# the one confirmed last (never confirmed, rolled back, flushed or changed by hand).
- name: Compare the candidate, the confirmed file and the loaded rules
  ansible.builtin.shell: |
    set -o pipefail
    cmp -s /etc/akasha/nftables.conf /etc/nftables.conf && echo file=confirmed || echo file=pending
    loaded=$(nft -s list ruleset | sha256sum | cut -d' ' -f1)
    [ "$loaded" = "$(cat /etc/akasha/nftables.loaded.sha256 2>/dev/null)" ] \
      && echo loaded=confirmed || echo loaded=pending
  args:
    executable: /bin/bash
  register: nft_commit_compare
  changed_when: false
  check_mode: false
  when: nft_commit_nft.stat.exists

- name: Decide whether the rules must be loaded
  ansible.builtin.set_fact:
    nft_commit_pending: >-
      {{ nft_commit_candidate is changed
         or 'file=pending' in nft_commit_compare.stdout_lines | default([])
         or 'loaded=pending' in nft_commit_compare.stdout_lines | default([]) }}

# --- Commit confirmed ------------------------------------------------------------------------

- name: Load the candidate rules, with a timed rollback
  when: nft_commit_pending | bool and not ansible_check_mode
  block:
    # Without become: sudo resets the environment and drops SSH_CLIENT. The new rules accept SSH
    # from nft_commit_ssh_sources only: stop before loading them if Ansible itself comes from
    # elsewhere.
    - name: Read the SSH connection Ansible uses now
      ansible.builtin.shell: |
        set -o pipefail
        echo "client=$SSH_CLIENT"
        src=${SSH_CLIENT%% *}
        echo "src=$src"
        python3 -c 'import ipaddress, sys
        src = ipaddress.ip_address(sys.argv[1])
        print("source=" + ("accepted" if any(src in ipaddress.ip_network(n) for n in sys.argv[2:]) else "refused"))' \
          "$src" {{ nft_commit_ssh_sources | join(' ') }}
      args:
        executable: /bin/bash
      register: nft_commit_ssh_before
      changed_when: false
      become: false

    - name: Check that the new rules will accept Ansible's own SSH source
      ansible.builtin.assert:
        that: "'source=accepted' in nft_commit_ssh_before.stdout_lines"
        fail_msg: >-
          {{ nft_commit_ssh_before.stdout_lines }}: the new rules accept SSH from
          {{ nft_commit_ssh_sources | join(', ') }} only; nothing was loaded.
        quiet: true

    # The restore file is the loaded rule set as nft prints it, after a flush: loading it is
    # one transaction. If what it restores has no akasha table (e.g. after a manual flush),
    # forwarding is turned off as well: the rollback never leaves a VM routing without rules
    # (a no-op on VMs that never forward).
    - name: Save the loaded rules for the rollback
      ansible.builtin.shell: |
        set -o pipefail
        install -d -m 0700 /run/akasha
        { echo 'flush ruleset'; nft list ruleset; } > /run/akasha/firewall-rollback.nft
      args:
        executable: /bin/bash
      changed_when: true

    # A timer left by an earlier run that never confirmed would make systemd-run fail.
    - name: Stop a rollback timer left by an earlier run
      ansible.builtin.systemd_service:
        name: akasha-firewall-rollback.timer
        state: stopped
      failed_when: false

    # AccuracySec=1s: the default accuracy of a timer is one minute.
    - name: Arm the rollback timer
      ansible.builtin.command:
        argv:
          - systemd-run
          - --collect
          - --unit=akasha-firewall-rollback
          - --on-active={{ nft_commit_rollback_seconds }}
          - --timer-property=AccuracySec=1s
          - /bin/sh
          - -c
          - >-
            /usr/sbin/nft -f /run/akasha/firewall-rollback.nft;
            /usr/sbin/nft list table inet akasha >/dev/null 2>&1
            || /usr/sbin/sysctl -q -w net.ipv4.ip_forward=0
      changed_when: true

    - name: Load the candidate rules (one transaction)
      ansible.builtin.command: /usr/sbin/nft -f /etc/akasha/nftables.conf
      changed_when: true

# The persistent SSH connection would survive rules that block new SSH connections: close it so
# the next task has to open a new one. (`meta` does not take `when`, so this runs every time.)
- name: Close Ansible's SSH connection
  ansible.builtin.meta: reset_connection

- name: Read the SSH connection Ansible uses after the rules were loaded
  ansible.builtin.command: printenv SSH_CLIENT
  register: nft_commit_ssh_after
  changed_when: false
  check_mode: false
  become: false

- name: Confirm the candidate rules
  when: nft_commit_pending | bool and not ansible_check_mode
  block:
    - name: Check that the VM was reached over a new connection
      ansible.builtin.assert:
        that:
          - ('client=' ~ nft_commit_ssh_after.stdout) not in nft_commit_ssh_before.stdout_lines
        fail_msg: >-
          Same SSH connection before and after the rules were loaded
          ({{ nft_commit_ssh_after.stdout }}): new SSH connections are not proven. The
          timer restores the previous rules within {{ nft_commit_rollback_seconds }} s and
          the confirmed file is unchanged.
        quiet: true

    - name: Stop the rollback timer
      ansible.builtin.systemd_service:
        name: akasha-firewall-rollback.timer
        state: stopped

    - name: Make the candidate the confirmed file loaded at boot
      ansible.builtin.copy:
        src: /etc/akasha/nftables.conf
        dest: /etc/nftables.conf
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Record the fingerprint of the confirmed rule set
      ansible.builtin.shell: |
        set -o pipefail
        nft -s list ruleset | sha256sum | cut -d' ' -f1 > /etc/akasha/nftables.loaded.sha256
      args:
        executable: /bin/bash
      changed_when: true

# --- Boot ------------------------------------------------------------------------------------

# nftables.service loads the confirmed /etc/nftables.conf before network-pre.target, so the
# rules are in place before any interface comes up. Starting it loads the same file again (one
# transaction). Package upgrades restart it (Debian's --restart-after-upgrade): its stop
# flushes the rules (and, on the router, stops forwarding through Requires=).
- name: Enable and start nftables at boot
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: true
    state: started
  when: not ansible_check_mode or nft_commit_nft.stat.exists
