---
# sshd trusts OpenBao's SSH user CA (ADR-0050). The CA's key comes first, then the drop-in that
# names it; both are checked before anything changes.

- name: Read the CA's public key from the repository
  ansible.builtin.set_fact:
    ssh_user_ca_key: "{{ lookup('ansible.builtin.file', ssh_user_ca_src, errors='ignore') | default('', true) | trim }}"

- name: Check the CA's public key and the principals
  ansible.builtin.assert:
    that:
      - ssh_user_ca_key is match('^ssh-ed25519 [A-Za-z0-9+/]+=*( [^\n]*)?$')
      - ssh_user_ca_principals | length > 0
    fail_msg: >-
      {{ ssh_user_ca_src }} must be one ssh-ed25519 public key (apply the stack openbao and
      commit its output ssh_user_ca_public_key there first, runbook bastion.md), and
      ssh_user_ca_principals must name at least one user. Nothing was changed.
    quiet: true

- name: Install the CA's public key
  ansible.builtin.copy:
    content: "{{ ssh_user_ca_key }}\n"
    dest: "{{ ssh_user_ca_dest }}"
    owner: root
    group: root
    mode: "0644"

# Root-owned, like the CA: the user it lets in cannot change it.
- name: Create the directory of the principals' files
  ansible.builtin.file:
    path: "{{ ssh_user_ca_principals_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: List the principals that may log in as each user
  ansible.builtin.copy:
    content: "{{ item.value | join('\n') }}\n"
    dest: "{{ ssh_user_ca_principals_dir }}/{{ item.key }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ssh_user_ca_principals | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# `validate:` does not run in check mode: check the drop-in with the VM's sshd in a temporary
# copy, so the dry run already proves the syntax.
- name: Check the SSH drop-in in a dry run
  when: ansible_check_mode
  check_mode: false
  block:
    - name: Create a temporary file for the SSH drop-in
      ansible.builtin.tempfile:
        suffix: .conf
      register: ssh_user_ca_tmp

    - name: Write the SSH drop-in into the temporary file
      ansible.builtin.template:
        src: 20-akasha-user-ca.conf.j2
        dest: "{{ ssh_user_ca_tmp.path }}"
        mode: "0600"

    - name: Check the SSH drop-in with sshd
      ansible.builtin.command: /usr/sbin/sshd -t -f {{ ssh_user_ca_tmp.path }}
      changed_when: false
  always:
    - name: Remove the temporary file
      ansible.builtin.file:
        path: "{{ ssh_user_ca_tmp.path }}"
        state: absent
      when: ssh_user_ca_tmp.path is defined

- name: Make sshd trust the CA (checked by sshd before the file is replaced)
  ansible.builtin.template:
    src: 20-akasha-user-ca.conf.j2
    dest: "{{ ssh_user_ca_dropin }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Apply a changed SSH configuration now
  ansible.builtin.meta: flush_handlers

# --- Checks ----------------------------------------------------------------------------------

# `sshd -T` prints the settings sshd uses once every file is read, drop-ins included.
- name: Read the CA sshd uses and its fingerprint
  ansible.builtin.shell: |
    set -o pipefail
    /usr/sbin/sshd -T | awk '$1 == "trustedusercakeys" { print "trusted=" $2 }
      $1 == "authorizedprincipalsfile" { print "principals=" $2 }'
    ssh-keygen -l -f {{ ssh_user_ca_dest }} | awk '{ print "fingerprint=" $2 }'
  args:
    executable: /bin/bash
  register: ssh_user_ca_state
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Check that sshd trusts the CA of the repository
  ansible.builtin.assert:
    that:
      - ("trusted=" ~ ssh_user_ca_dest) in ssh_user_ca_state.stdout_lines
      - ("principals=" ~ ssh_user_ca_principals_dir ~ "/%u") in ssh_user_ca_state.stdout_lines
    fail_msg: "{{ ssh_user_ca_state.stdout_lines }}"
    success_msg: "{{ ssh_user_ca_state.stdout_lines }}"
  when: not ansible_check_mode
