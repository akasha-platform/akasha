---
# OpenBao's SSH user CA (ADR-0050): its public key, committed once the stack `openbao` created
# it (runbook bastion.md). sshd accepts a certificate it signed for the user the certificate
# names, in addition to the keys of authorized_keys.
ssh_user_ca_src: "{{ role_path }}/../../../pki/ssh-user-ca.pub"
ssh_user_ca_dest: /etc/ssh/akasha-user-ca.pub
ssh_user_ca_dropin: /etc/ssh/sshd_config.d/20-akasha-user-ca.conf
