---
- name: Apply the akasha sysctl settings
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-akasha-network.conf
  changed_when: true

- name: Restart libvirt
  ansible.builtin.systemd_service:
    name: "{{ host_network_libvirt_service }}"
    state: restarted

- name: Reload the NetworkManager configuration
  ansible.builtin.command: nmcli general reload conf
  changed_when: true
