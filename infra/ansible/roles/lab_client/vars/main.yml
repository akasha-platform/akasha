---
# Command that checks a chrony file before it is used (`validate:` and the dry run). Debian's
# AppArmor profile for /usr/sbin/chronyd lets it read /etc/chrony/, `/etc/chrony.*` and a few
# other paths, not Ansible's temporary files: copy the file to /etc/chrony.akasha-check.conf
# (allowed by the profile, never read by chronyd on its own, and present whether or not chronyd
# runs), parse it with `chronyd -p`, then remove the copy.
lab_client_check_command: >-
  /bin/sh -c 'f=/etc/chrony.akasha-check.conf; install -m 0600 "$1" "$f"
  && /usr/sbin/chronyd -p -f "$f"; rc=$?; rm -f "$f"; exit $rc' check
