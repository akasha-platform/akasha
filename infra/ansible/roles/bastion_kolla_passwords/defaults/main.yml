---
# Kolla-Ansible's passwords on the bastion (ADR-0052): akasha-kolla-passwords reads them from
# OpenBao into a tmpfs without swap, for the time of a run.

bastion_kolla_passwords_user: akasha
# The tmpfs that holds the only copy on the bastion, and Ansible's temporary files of a Kolla
# run (infra/kolla/ansible.cfg), which hold rendered configuration files with passwords: no
# swap, no executable, empty after every boot. The size is a ceiling, not a reservation: the
# copy is about 36 KiB; the temporary files are to be measured in P2 step 5.
# Also written in infra/kolla/ansible.cfg (local_tmp) and infra/kolla/multinode
# (ansible_remote_tmp): change the three together.
bastion_kolla_passwords_dir: /run/akasha-kolla
bastion_kolla_passwords_size: 32m
# A copy older than this is removed by a timer: the lifetime of an SSH certificate (ADR-0050).
bastion_kolla_passwords_max_age_minutes: 480

# OpenBao over TLS (ADR-0047), its user and where the passwords live (stack openbao, kv.tf).
bastion_kolla_passwords_openbao_addr: https://core.akasha.internal:8200
bastion_kolla_passwords_openbao_user: operator
bastion_kolla_passwords_mount: kv
bastion_kolla_passwords_path: kolla/passwords
# The system's bundle, which holds the lab's root CA (role lab_trust). Python's requests does
# not read it unless told.
bastion_kolla_passwords_ca_file: /etc/ssl/certs/ca-certificates.crt

# The OpenStack APIs' certificate and key (ADR-0053), in the same mount: written by the admin,
# read here. `read` writes HAProxy's and ProxySQL's files only for a certificate that holds
# every name and address below, chains to the lab's root and has at least `min_days` days
# left; it warns when fewer than `warn_days` are left. The names and addresses are also in
# infra/kolla/globals.d/10-network.yml and the role router_dns: change the three together.
bastion_kolla_passwords_tls_path: kolla/tls/haproxy
bastion_kolla_passwords_tls_names:
  - api.akasha.internal
  - api-int.akasha.internal
bastion_kolla_passwords_tls_addresses:
  - 10.10.0.101
  - 10.10.0.100
bastion_kolla_passwords_tls_warn_days: 30
bastion_kolla_passwords_tls_min_days: 7
# The trust anchor of the checks, and the CA given to Kolla's containers: the root-owned copy
# the role lab_trust installs, not the toolchain user's checkout, which that user can change.
bastion_kolla_passwords_root_ca: /usr/local/share/ca-certificates/akasha-root-ca.crt
