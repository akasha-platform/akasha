---
argument_specs:
  main:
    short_description: Kolla's passwords and API certificate from OpenBao, in RAM on the bastion (ADR-0052, ADR-0053)
    description:
      - Mounts a tmpfs without swap for the toolchain user, installs akasha-kolla-passwords
        (init, read, clean) and a timer that removes a copy older than the age limit.
      - read also writes HAProxy's and ProxySQL's certificate files there, after checking them.
    options:
      bastion_kolla_passwords_user:
        type: str
        description: The toolchain user (ADR-0040), who runs Kolla-Ansible.
      bastion_kolla_passwords_dir:
        type: path
        description: Mount point of the tmpfs that holds the copy.
      bastion_kolla_passwords_size:
        type: str
        description: Size limit of the tmpfs.
      bastion_kolla_passwords_max_age_minutes:
        type: int
        description: Age after which the timer removes a copy.
      bastion_kolla_passwords_openbao_addr:
        type: str
        description: OpenBao's TLS address.
      bastion_kolla_passwords_openbao_user:
        type: str
        description: The userpass user that reads and writes the passwords.
      bastion_kolla_passwords_mount:
        type: str
        description: The KV v2 mount.
      bastion_kolla_passwords_path:
        type: str
        description: The path of the passwords inside the mount.
      bastion_kolla_passwords_ca_file:
        type: path
        description: CA bundle that verifies OpenBao's certificate.
      bastion_kolla_passwords_tls_path:
        type: str
        description: The path of the APIs' certificate and key inside the mount.
      bastion_kolla_passwords_tls_names:
        type: list
        elements: str
        description: DNS names the certificate must hold; the first is checked first.
      bastion_kolla_passwords_tls_addresses:
        type: list
        elements: str
        description: IP addresses the certificate must hold.
      bastion_kolla_passwords_tls_warn_days:
        type: int
        description: Days before the certificate's expiry from which read warns.
      bastion_kolla_passwords_tls_min_days:
        type: int
        description: Days before the certificate's expiry from which read refuses.
      bastion_kolla_passwords_root_ca:
        type: path
        description: The lab's root CA, root-owned (role lab_trust); trust anchor of the checks.
