---
# SSH from the bastion to the OpenStack nodes (ADR-0050): a key of the toolchain user, signed by
# OpenBao on demand (akasha-ssh-cert), and the nodes' host keys copied from the laptop.

# Read-only, on the laptop: each host key was verified against the VM's serial console before
# it was added there (runbook lab-vms.md). ssh-keygen -F also finds hashed entries.
- name: Read the nodes' host keys from the laptop's known_hosts
  ansible.builtin.command: >-
    ssh-keygen -F {{ hostvars[item].ansible_host }} -f {{ bastion_ssh_laptop_known_hosts }}
  loop: "{{ bastion_ssh_targets }}"
  register: bastion_ssh_laptop_keys
  delegate_to: localhost
  become: false
  changed_when: false
  # 1: the host is unknown, reported by the next task.
  failed_when: bastion_ssh_laptop_keys.rc not in [0, 1]
  check_mode: false

- name: Check that the laptop knows every node
  ansible.builtin.assert:
    that:
      - bastion_ssh_laptop_keys.results | map(attribute='rc') | select('ne', 0) | list | length == 0
    fail_msg: >-
      The laptop has no verified host key for
      {{ bastion_ssh_laptop_keys.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}
      (runbook lab-vms.md). Nothing was changed.
    quiet: true

# "<address> <type> <key>" for every key of every node, whether the laptop's entry is hashed
# or not. Markers (@cert-authority, @revoked) are skipped: the bastion learns plain keys only.
- name: List the host keys for the bastion
  ansible.builtin.set_fact:
    bastion_ssh_known: >-
      {%- set lines = [] -%}
      {%- for r in bastion_ssh_laptop_keys.results -%}
      {%- for l in r.stdout_lines if l and not l.startswith('#') and not l.startswith('@') -%}
      {%- set f = l.split() -%}
      {%- set _ = lines.append({'name': hostvars[r.item].ansible_host,
                                'key': hostvars[r.item].ansible_host ~ ' ' ~ f[1] ~ ' ' ~ f[2]}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ lines }}

- name: Look for the toolchain user
  ansible.builtin.getent:
    database: passwd
    key: "{{ bastion_ssh_user }}"
    fail_key: false

# A dry run on a VM without the user cannot run anything as that user (the role
# bastion_toolchain creates it).
- name: Set up the toolchain user's SSH key and known hosts
  when: >-
    not ansible_check_mode
    or (ansible_facts.getent_passwd[bastion_ssh_user] is not none)
  become: true
  become_user: "{{ bastion_ssh_user }}"
  block:
    - name: Create the toolchain user's SSH directory
      ansible.builtin.file:
        path: /home/{{ bastion_ssh_user }}/.ssh
        state: directory
        mode: "0700"

    # Without a certificate the key opens nothing: no node lists it in authorized_keys.
    - name: Create the toolchain user's SSH key
      ansible.builtin.command: >-
        ssh-keygen -q -t ed25519 -N '' -C {{ bastion_ssh_user }}@{{ inventory_hostname }}
        -f /home/{{ bastion_ssh_user }}/.ssh/id_ed25519
      args:
        creates: /home/{{ bastion_ssh_user }}/.ssh/id_ed25519

    - name: Add the nodes' host keys to the toolchain user's known_hosts
      ansible.builtin.known_hosts:
        path: /home/{{ bastion_ssh_user }}/.ssh/known_hosts
        name: "{{ item.name }}"
        key: "{{ item.key }}"
        state: present
      loop: "{{ bastion_ssh_known }}"
      loop_control:
        label: "{{ item.name }}"

    # known_hosts follows the umask (group-writable on Debian); only its owner writes it. A dry
    # run on a new VM has no file yet.
    - name: Look for the toolchain user's known_hosts
      ansible.builtin.stat:
        path: /home/{{ bastion_ssh_user }}/.ssh/known_hosts
      register: bastion_ssh_known_hosts

    - name: Make the toolchain user's known_hosts writable by its owner only
      ansible.builtin.file:
        path: /home/{{ bastion_ssh_user }}/.ssh/known_hosts
        mode: "0644"
      when: bastion_ssh_known_hosts.stat.exists

- name: Install akasha-ssh-cert
  ansible.builtin.template:
    src: akasha-ssh-cert.j2
    dest: /usr/local/bin/akasha-ssh-cert
    owner: root
    group: root
    mode: "0755"

# --- Checks ----------------------------------------------------------------------------------

- name: Read the toolchain user's key
  ansible.builtin.command: >-
    ssh-keygen -l -f /home/{{ bastion_ssh_user }}/.ssh/id_ed25519.pub
  register: bastion_ssh_key
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Show the toolchain user's public key
  ansible.builtin.debug:
    msg: "{{ bastion_ssh_key.stdout }}"
  when: not ansible_check_mode
