---
# Lab firewall and NAT of ADR-0008, scoped to akasha's own bridges and ranges (ADR-0027):
# packets that neither enter nor leave one of these bridges nor are routed towards a lab range
# are never matched.
host_firewall_uplink: eno1
host_firewall_lab_interfaces:
  - br-transit
  - br-mgmt
  - br-tun
  - br-ext
# The only bridge the lab may route through: the edge router's WAN side.
host_firewall_transit_interface: br-transit
host_firewall_transit_address: 10.255.255.1
# Lab ranges: allowed sources of routed lab traffic, and destinations that may only be reached
# through the transit bridge. Keep in sync with the routes of host_network_bridges (role
# host_network); the role checks that each range is routed via the transit bridge.
host_firewall_lab_nets:
  - 10.10.0.0/24
  - 10.20.0.0/24
  - 10.255.255.0/29
# Lab networks reachable from the tailnet (Tailscale subnet routes, P1 step 4c).
host_firewall_tailnet_to_lab:
  - 10.10.0.0/24
  - 10.20.0.0/24
# Destinations the lab never reaches through the uplink: private, shared, loopback,
# link-local, documentation, benchmarking, multicast and reserved ranges (RFC 6890).
host_firewall_blocked_nets:
  - 0.0.0.0/8
  - 10.0.0.0/8
  - 100.64.0.0/10
  - 127.0.0.0/8
  - 169.254.0.0/16
  - 172.16.0.0/12
  - 192.0.0.0/24
  - 192.0.2.0/24
  - 192.88.99.0/24
  - 192.168.0.0/16
  - 198.18.0.0/15
  - 198.51.100.0/24
  - 203.0.113.0/24
  - 224.0.0.0/4
  - 240.0.0.0/4
# Public prefixes of the campus network, blocked like the ranges above. Never committed:
# pass them at run time, e.g. `-e @~/akasha-private/host_firewall.yml`.
host_firewall_campus_nets: []
