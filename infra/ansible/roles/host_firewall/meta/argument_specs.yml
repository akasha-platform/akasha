---
argument_specs:
  main:
    short_description: Lab firewall and NAT of the L0 host, scoped to the lab bridges and ranges (ADR-0008, ADR-0027)
    options:
      host_firewall_uplink:
        type: str
        description: Uplink interface (NAT egress); must be the interface of the default route.
      host_firewall_lab_interfaces:
        type: list
        elements: str
        description:
          - Lab bridges; packets entering or leaving them are matched, and so are routed
            packets towards host_firewall_lab_nets.
      host_firewall_transit_interface:
        type: str
        description: The only lab bridge allowed to route through the host (edge router WAN).
      host_firewall_transit_address:
        type: str
        description: Host address on the transit bridge; the lab may ping it and nothing else.
      host_firewall_lab_nets:
        type: list
        elements: str
        description:
          - Lab ranges. As sources, anti-spoofing and NAT. As destinations, routed packets may
            only leave through the transit bridge. Every range must be routed via the transit
            bridge by host_network (checked at run time).
      host_firewall_tailnet_to_lab:
        type: list
        elements: str
        description: Lab ranges reachable from tailscale0.
      host_firewall_blocked_nets:
        type: list
        elements: str
        description: Destinations the lab never reaches through the uplink (RFC 6890 ranges).
      host_firewall_campus_nets:
        type: list
        elements: str
        description:
          - Public prefixes of the campus network, also blocked. Never committed; pass them at
            run time from a private file.
