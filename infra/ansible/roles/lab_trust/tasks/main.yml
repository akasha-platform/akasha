---
# The lab's root CA in the system trust store (ADR-0044, ADR-0047). Clients that use it (curl,
# OpenSSL, Go, Python's ssl module) then verify certificates from OpenBao's PKI. Python
# `requests`/`httpx` in a virtual environment use certifi instead: point them at
# /etc/ssl/certs/ca-certificates.crt (REQUESTS_CA_BUNDLE, SSL_CERT_FILE) in P2.

- name: Install the CA certificates package
  ansible.builtin.apt:
    name: ca-certificates
    state: present

- name: Install the lab's root CA
  ansible.builtin.copy:
    src: "{{ lab_trust_root_ca_src }}"
    dest: /usr/local/share/ca-certificates/akasha-root-ca.crt
    owner: root
    group: root
    mode: "0644"
  notify: Update the system trust store

- name: Update the trust store now
  ansible.builtin.meta: flush_handlers

# Repairs a store that missed an update (the handler only runs when the file changes).
- name: Look for the root in the system trust store
  ansible.builtin.stat:
    path: /etc/ssl/certs/akasha-root-ca.pem
  register: lab_trust_link

- name: Add the root to the system trust store when it is missing
  ansible.builtin.command: update-ca-certificates
  changed_when: true
  when: not lab_trust_link.stat.exists

- name: Check that OpenSSL trusts the root through the system store
  ansible.builtin.command: >-
    openssl verify -CApath /etc/ssl/certs /usr/local/share/ca-certificates/akasha-root-ca.crt
  register: lab_trust_verify
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
