# Managed by akasha (Ansible role vm_base, ADR-0035): SSH accepts keys only, never root.
# sshd keeps the first value it reads for each option and reads sshd_config.d/*.conf in name
# order from the top of sshd_config, so this file wins over 50-cloud-init.conf.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
