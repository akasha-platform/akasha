---
argument_specs:
  main:
    short_description: Host firewall of a lab VM, loaded commit confirmed (ADR-0039)
    description:
      - Input drops by default except loopback, established traffic, ping and SSH from the given
        sources, and the listed TCP services; nothing is forwarded; IPv6 is dropped.
    options:
      vm_firewall_ssh_sources:
        type: list
        elements: str
        description: Addresses or networks allowed to SSH (and checked against Ansible's own).
      vm_firewall_ping_sources:
        type: list
        elements: str
        description: Addresses or networks allowed to ping.
      vm_firewall_tcp_services:
        type: list
        elements: dict
        description: Extra TCP services, each with its sources.
        options:
          port:
            type: int
            required: true
          sources:
            type: list
            elements: str
            required: true
          comment:
            type: str
            required: true
      vm_firewall_log_rate:
        type: int
        description: Logged drops per minute.
