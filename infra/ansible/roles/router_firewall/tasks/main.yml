---
# Firewall and forwarding of the edge router (ADR-0028, ADR-0037).
# A changed rule set is loaded "commit confirmed" by the shared role nft_commit: a timer
# restores the previous rules unless Ansible reaches the router again over a new SSH
# connection. Forwarding comes last, and only through a unit that requires the firewall
# (fail-closed at boot).

# The caller's template, as an absolute path for the shared role. Tagged `always`: ansible-core
# checks nft_commit's arguments on every run, whatever tags are selected.
- name: Point the shared role at the router's rules
  ansible.builtin.set_fact:
    router_firewall_src: "{{ role_path }}/templates/nftables.conf.j2"
  tags: [always]

- name: Load the router's rules commit confirmed
  ansible.builtin.import_role:
    name: nft_commit
  vars:
    nft_commit_src: "{{ router_firewall_src }}"
    nft_commit_ssh_sources:
      - "{{ router_firewall_tailnet_source }}/32"
      - "{{ router_firewall_mgmt_net }}"
    nft_commit_rollback_seconds: "{{ router_firewall_rollback_seconds }}"

# --- Forwarding ------------------------------------------------------------------------------

- name: Install the unit that turns forwarding on after the firewall
  ansible.builtin.copy:
    src: akasha-forwarding.service
    dest: /etc/systemd/system/akasha-forwarding.service
    owner: root
    group: root
    mode: "0644"

- name: Enable and start forwarding
  ansible.builtin.systemd_service:
    name: akasha-forwarding.service
    enabled: true
    state: started
    daemon_reload: true
  # In check mode the unit file is not written, so systemd does not know the unit yet.
  ignore_errors: "{{ ansible_check_mode }}"

# --- Checks ----------------------------------------------------------------------------------

- name: Read the firewall, the forwarding state and the rollback timer
  ansible.builtin.shell: |
    set -o pipefail
    for u in nftables.service akasha-forwarding.service; do
      echo "$u active=$(systemctl is-active "$u") enabled=$(systemctl is-enabled "$u")"
    done
    echo "rollback=$(systemctl is-active akasha-firewall-rollback.timer)"
    echo "ip_forward=$(cat /proc/sys/net/ipv4/ip_forward)"
    cmp -s /etc/akasha/nftables.conf /etc/nftables.conf && echo file=confirmed
    [ "$(nft -s list ruleset | sha256sum | cut -d' ' -f1)" = "$(cat /etc/akasha/nftables.loaded.sha256)" ] \
      && echo loaded=confirmed
    nft list tables | sed 's/^/table=/'
    nft list table inet akasha | awk '$1 == "chain" { c = $2 } /policy/ { print "chain=" c " " $NF }'
  args:
    executable: /bin/bash
  register: router_firewall_state
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Check that the firewall is loaded alone, drops by default, and that forwarding is on
  ansible.builtin.assert:
    that:
      - "'nftables.service active=active enabled=enabled' in router_firewall_state.stdout_lines"
      - "'akasha-forwarding.service active=active enabled=enabled' in router_firewall_state.stdout_lines"
      - "'rollback=inactive' in router_firewall_state.stdout_lines"
      - "'ip_forward=1' in router_firewall_state.stdout_lines"
      - "'file=confirmed' in router_firewall_state.stdout_lines"
      - "'loaded=confirmed' in router_firewall_state.stdout_lines"
      - router_firewall_state.stdout_lines | select('match', 'table=') | list == ['table=table inet akasha']
      - "'chain=prerouting accept;' in router_firewall_state.stdout_lines"
      - "'chain=input drop;' in router_firewall_state.stdout_lines"
      - "'chain=forward drop;' in router_firewall_state.stdout_lines"
    fail_msg: "{{ router_firewall_state.stdout_lines }}"
    quiet: true
  when: not ansible_check_mode
