# Ansible configuration (ADR-0026). Run commands from this directory:
#   cd infra/ansible && uv run ansible-playbook playbooks/<name>.yml
[defaults]
inventory = inventories/lab/hosts.yml
collections_path = collections
roles_path = roles
# Never fall back to collections installed elsewhere on the machine
collections_scan_sys_path = false
host_key_checking = true
interpreter_python = /usr/bin/python3
retry_files_enabled = false
forks = 5

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = true
