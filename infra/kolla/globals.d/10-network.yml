---
# Networking (ADR-0006, ADR-0041, ADR-0053). Still open, for a later step: the tenant MTU (B2,
# step 5).

# The three NICs, named alike on every node by cloud-init (ADR-0041):
# mgmt on br-mgmt (10.10.0.x): management and the OpenStack APIs;
network_interface: "mgmt"
# tun on br-tun (10.30.0.x, MTU 9000): the Geneve overlay between the nodes;
tunnel_interface: "tun"
# ext on br-ext, up without any address: OVN's provider bridge.
neutron_external_interface: "ext"

# OVN, not Kolla's default openvswitch agent (ADR-0006).
neutron_plugin_agent: "ovn"

# Two VIPs on mgmt, held by keepalived on os-ctl01 (ADR-0053). Their names are in the lab's DNS
# (role router_dns) and in the APIs' certificate: endpoints use the names, never the addresses.
# Internal: the internal endpoints and MariaDB (port 3306).
kolla_internal_vip_address: "10.10.0.100"
kolla_internal_fqdn: "api-int.akasha.internal"
# External: the public endpoints only, for clients outside br-mgmt (the K3s VMs, from P4).
kolla_external_vip_address: "10.10.0.101"
kolla_external_fqdn: "api.akasha.internal"
