# Ansible configuration of Kolla-Ansible (ADR-0051). Run kolla-ansible from this directory, so
# that this file applies and not infra/ansible's:
#   cd infra/kolla && mise exec -- uv run --locked kolla-ansible <command> --configdir . -i multinode
[defaults]
inventory = multinode
# Kolla's own pinned collections only (collections/requirements.yml): never the repository's,
# whose community.general is too new for Kolla, and never ones installed elsewhere.
collections_path = collections
collections_scan_sys_path = false
host_key_checking = true
interpreter_python = /usr/bin/python3
retry_files_enabled = false
forks = 5

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = true
# Never accept an unknown host key: the bastion's known_hosts holds the keys checked on the
# laptop (ADR-0050).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes
