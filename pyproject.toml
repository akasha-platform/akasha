# Pinned Python tooling for this repository (ADR-0022). Not a Python package.
# uv.lock records exact versions and hashes; install with `uv sync --locked`.

[project]
name = "akasha-tooling"
version = "0.0.0"
description = "Pinned Python developer tooling for the akasha repository"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  # ansible-core 2.20.x satisfies kolla-ansible 2026.1 (<2.21) and 2026.2 (>=2.20)
  "ansible-core>=2.20,<2.21",
  "ansible-lint",
  "yamllint",
  "pre-commit",
  # generic hygiene hooks, locked here (with ruamel.yaml) instead of a pip install by pre-commit
  "pre-commit-hooks>=6,<7",
]

[tool.uv]
package = false
# Same interpreter and uv on the laptop and in CI (ADR-0022)
required-version = ">=0.13.6,<0.14"   # keep in line with mise.toml
python-preference = "only-managed"    # uv-downloaded, hash-verified CPython; never the system one
# 7-day rule for PyPI, as a fixed date so resolution is reproducible. Move it forward on purpose.
exclude-newer = "2026-11-02T00:00:00Z"
